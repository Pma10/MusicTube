name: CI

on:
  push:
    branches: [main, "feat/**", "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Smoke test fast MP4 render
        run: npm run render:smoke
      - name: Render visual design proof
        if: github.event_name == 'pull_request'
        run: npm run design:proof
      - name: Upload visual design proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: musictube-design-proof
          path: artifacts/design-proof.png
          retention-days: 3
