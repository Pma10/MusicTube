name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Render visual design proof
        if: github.event_name == 'pull_request'
        run: npm run design:proof
      - name: Upload visual design proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: musictube-design-proof
          path: artifacts/design-proof.png
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python -c "from backend.main import app; print(app.title)"
